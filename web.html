<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Codex remote</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; width: 100%; overflow-x: hidden; background: #101820; color: #ecf2f1; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: 100%; min-width: 0; height: 100dvh; max-width: 880px; margin: auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
    header { position: relative; min-width: 0; display: flex; align-items: center; gap: 11px; padding: 12px 16px; border-bottom: 1px solid #30434b; background: #142129; }
    .chat-heading { min-width: 0; }
    h1 { margin: 0; font-size: 1.08rem; }
    #chat-id { margin: 2px 0 0; color: #9aafb5; font-size: .77rem; }
    .header-actions { display: flex; align-items: center; gap: 9px; }
    #status { min-width: 0; margin-left: auto; color: #9fd8bd; font-size: .8rem; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 39px; min-height: 39px; padding: 8px; background: #283b42; border: 1px solid #60747c; border-radius: 9px; color: #e4eeee; }
    .icon-button:hover, .icon-button:focus-visible { background: #3b4c52; }
    #end-session { color: #f5d8d2; }
    .icon-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    #menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 12px; width: min(320px, calc(100vw - 24px)); padding: 11px; background: #20313a; border: 1px solid #58717b; border-radius: 12px; box-shadow: 0 12px 30px #0008; }
    #menu h2 { margin: 3px 6px 9px; font-size: .91rem; }
    #menu-list { display: grid; gap: 5px; }
    #menu-list a { display: block; border-radius: 8px; padding: 10px; color: #dce9e8; text-decoration: none; }
    #menu-list a:hover, #menu-list a[aria-current="page"] { background: #325048; }
    #menu-list small { display: block; color: #a9bec1; margin-top: 3px; }
    #activity-panel { position: absolute; z-index: 6; top: calc(100% + 4px); right: 12px; width: min(560px, calc(100vw - 24px)); max-height: min(70dvh, 650px); padding: 12px; border: 1px solid #58717b; border-radius: 12px; background: #20313a; box-shadow: 0 12px 30px #0008; }
    #activity-panel h2 { margin: 2px 3px 8px; color: #b1d5e5; font-size: .95rem; }
    .activity-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 3px 8px; color: #9db0b6; font-size: .8rem; }
    #refresh-activity { border: 1px solid #60747c; border-radius: 8px; padding: 7px 10px; background: #283b42; color: #e4eeee; }
    #activity-list { max-height: min(52dvh, 500px); overflow-y: auto; display: grid; gap: 8px; padding: 2px; }
    #activity-list .entry.tool { background: #172a34; }
    #feed { min-width: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 14px; scrollbar-gutter: stable; }
    .entry { border: 1px solid #33464e; border-radius: 13px; background: #1c2a32; min-width: 0; max-width: 100%; }
    .entry.user { background: #254b40; border-color: #3c6a58; align-self: flex-end; max-width: 90%; padding: 10px 13px; }
    .entry.assistant, .entry.tool { width: 100%; }
    .entry-head, summary { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .user .entry-head { padding: 1px 0 6px; }
    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .toggle { width: 28px; height: 28px; border: 1px solid #60747c; border-radius: 7px; display: grid; place-items: center; flex: none; margin-left: 4px; }
    .toggle::before { content: ''; width: 8px; height: 8px; border-right: 2px solid #c9dfda; border-bottom: 2px solid #c9dfda; transform: rotate(-45deg); transition: transform .15s ease; }
    details[open] > summary .toggle::before { transform: rotate(45deg); }
    summary:hover { background: #253740; border-radius: 13px; }
    .assistant[open] > summary .preview { display: none; }
    .who { font-weight: 700; white-space: nowrap; }
    .assistant .who { color: #8bd7b8; }
    .tool .who { color: #9cc7db; }
    .preview { color: #c8d5d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
    time { color: #9db0b6; font-size: .76rem; white-space: nowrap; margin-left: auto; }
    .entry-body { border-top: 1px solid #30434b; padding: 10px 12px 12px; overflow-wrap: anywhere; }
    .user .entry-body { border: 0; padding: 0; }
    .markdown { line-height: 1.45; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown p, .markdown ul, .markdown ol, .markdown blockquote { margin: 0 0 .55em; }
    .markdown p { white-space: pre-wrap; }
    .markdown ul, .markdown ol { padding-left: 1.3em; }
    .markdown h1, .markdown h2, .markdown h3 { margin: 1.1em 0 .45em; line-height: 1.25; }
    .markdown h1 { font-size: 1.3rem; } .markdown h2 { font-size: 1.13rem; } .markdown h3 { font-size: 1.02rem; }
    .markdown blockquote { border-left: 3px solid #789a9a; padding-left: 12px; color: #c2d0d2; }
    .markdown a { color: #9ad7e2; }
    .markdown code { background: #2b3e45; padding: 1px 4px; border-radius: 4px; font: .9em ui-monospace, SFMono-Regular, monospace; }
    pre { background: #101d24; border: 1px solid #30434b; border-radius: 9px; padding: 12px; overflow: auto; white-space: pre; max-height: 380px; margin: 9px 0 0; font: 12px/1.5 ui-monospace, SFMono-Regular, monospace; }
    pre code { background: none !important; padding: 0 !important; white-space: pre; }
    .meta { color: #9db0b6; font-size: .8rem; margin: 0 0 6px; overflow-wrap: anywhere; }
    .composer { min-width: 0; border-top: 1px solid #30434b; background: #142129; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); }
    form { display: flex; align-items: stretch; gap: 8px; }
    textarea { flex: 1; min-width: 0; min-height: 48px; max-height: 160px; resize: vertical; background: #253943; color: #f1f5f5; border: 1px solid #58717b; border-radius: 9px; padding: 10px 12px; }
    textarea:focus-visible { outline: 2px solid #70d6a9; outline-offset: 1px; }
    #send { border: 0; border-radius: 9px; padding: 0 17px; background: #70d6a9; color: #10251c; font-weight: 700; }
    #pick-image { flex: none; display: grid; place-items: center; width: 44px; min-height: 44px; border: 1px solid #60747c; border-radius: 9px; background: #283b42; color: #e4eeee; }
    #pick-image svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .image-tools { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .image-tools button { border: 1px solid #60747c; border-radius: 8px; padding: 6px 9px; background: #283b42; color: #e4eeee; }
    #image-preview { max-width: 40px; max-height: 40px; border-radius: 6px; object-fit: cover; }
    button:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
    #notice { margin: 6px 0 0; color: #f2c990; font-size: .82rem; }
    #notice:empty { display: none; }
    dialog { width: min(92vw, 420px); border: 1px solid #58717b; border-radius: 14px; background: #1c2a32; color: #ecf2f1; padding: 20px; box-shadow: 0 18px 50px #0009; }
    dialog::backdrop { background: #000a; }
    dialog h2 { margin: 0 0 10px; font-size: 1.16rem; }
    dialog p { line-height: 1.45; color: #c5d2d4; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .dialog-actions button { border: 1px solid #60747c; border-radius: 8px; padding: 9px 12px; background: #2d4149; color: #f0f5f4; }
    #confirm-end { background: #aa524b; border-color: #aa524b; color: white; }
    #dialog-error { min-height: 1em; color: #ffb8a9; font-size: .84rem; }
    @media (max-width: 560px) { header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; padding: 9px 10px; } .chat-heading { overflow: hidden; } h1, #chat-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #status { grid-column: 1 / -1; grid-row: 2; margin: 0; text-align: left; font-size: .74rem; } .header-actions { grid-column: 3; grid-row: 1; gap: 6px; } #feed { padding: 10px; } .entry.assistant summary .preview, .entry.tool summary .preview { display: none; } .composer { padding: 8px 10px max(8px, env(safe-area-inset-bottom)); } textarea { font-size: 16px; } #end-session span { display: none; } .entry.user { max-width: 94%; padding: 9px 11px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <button id="menu-toggle" class="icon-button" type="button" aria-label="Open chat menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="chat-heading"><h1>Codex remote</h1><p id="chat-id">Connecting to chat…</p></div>
      <span id="status" role="status">Connecting…</span><div class="header-actions"><button id="activity-toggle" class="icon-button" type="button" aria-label="Show activity logs" aria-controls="activity-panel" aria-expanded="false" title="Activity logs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button><button id="end-session" class="icon-button" type="button" aria-label="End this remote session" title="End this remote session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M5.6 5.6a9 9 0 1 0 12.8 0"/></svg><span>End</span></button></div>
      <nav id="menu" aria-label="Remote chats" hidden><h2>Your remote chats</h2><div id="menu-list"></div></nav>
      <aside id="activity-panel" aria-label="Activity logs" hidden><h2>Activity logs</h2><div class="activity-actions"><span id="activity-status">Not loaded</span><button id="refresh-activity" type="button">Refresh logs</button></div><div id="activity-list"></div></aside>
    </header>
    <section id="feed" aria-label="Chat messages"></section>
    <div class="composer"><form id="form"><button id="pick-image" type="button" aria-label="Attach image" title="Attach image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-9.2 9.2a6 6 0 0 1-8.5-8.5l9.5-9.5a4 4 0 0 1 5.7 5.7l-9.5 9.5a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><textarea id="prompt" aria-label="Message this Codex chat" placeholder="Message this Codex chat"></textarea><button id="send" type="submit">Queue</button></form><input id="image-input" type="file" accept="image/*" hidden><div id="image-tools" class="image-tools" hidden><img id="image-preview" alt="Selected image preview"><button id="remove-image" type="button" aria-label="Remove image">Remove image</button></div><p id="notice" role="status"></p></div>
  </main>
  <dialog id="stop-dialog" aria-labelledby="stop-title"><h2 id="stop-title">End this remote session?</h2><p>This revokes this chat’s phone link. If it is your last remote chat, your Mac can sleep normally. Your Codex chat stays open on the Mac.</p><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button id="cancel-end" type="button">Keep active</button><button id="confirm-end" type="button">End this chat</button></div></dialog>
  <script src="/app.js?v=activity-popover-1"></script>
</body>
</html>
